<!doctype html>
<html lang="en" data-lang="en" data-theme="dark" class="no-js">
<head>
  {%- include kspace/head.html -%}
</head>
<body>
  <a class="k-sr-only" href="#k-content">Skip to content</a>

  <div class="k-shell">
    {%- include kspace/nav.html -%}

    <main class="k-main" id="k-content">
      {{ content }}
    </main>

    {%- include kspace/footer.html -%}
  </div>

  <button type="button" class="k-totop" data-totop aria-label="Back to top">
    {%- include kspace/icon.html name="arrow-up" -%}
  </button>
  <div class="k-toast" data-toast role="status" aria-live="polite"></div>

  <script src="{{ '/assets/js/kspace.js' | relative_url }}" defer></script>
</body>
</html>
