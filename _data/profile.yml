# One-sentence research positioning (HTML allowed)
pitch:
  en: "I work on building extraction from <strong>off-nadir</strong> remote sensing imagery. I proposed the concept of the <strong>Offset Token</strong>, which brings off-nadir photogrammetry into the perceptual scope of vision foundation models, and I am now extending 3D spatial understanding to <strong>vision-language models</strong>."
  zh: "我的研究聚焦<strong>偏移摄影（Off-Nadir）</strong>视角下的遥感建筑物提取。我提出了<strong>偏移量词元（Offset Token）</strong>的概念，将偏移摄影带入视觉大模型的理解视角；目前正把三维空间理解能力拓展到<strong>视觉语言大模型</strong>方向。"

avatar: "/images/mybib.jpg"

# Long-form intro used on the CV page (HTML allowed)
bio:
  en: >-
    I am a PhD student at the University of Chinese Academy of Sciences
    (<a href="https://english.ucas.ac.cn/" target="_blank" rel="noopener">UCAS</a>),
    currently on a joint PhD project at City University of Hong Kong
    (<a href="https://www.cityu.edu.hk/" target="_blank" rel="noopener">CityU</a>).
    At UCAS I am supervised by
    <a href="http://www.aircas.cas.cn/ykjs/lrld/202505/t20250521_7789207.html" target="_blank" rel="noopener">Prof. Zhongming Zhao</a>
    and <a href="https://people.ucas.ac.cn/~0010249" target="_blank" rel="noopener">Prof. Yu Meng</a>;
    at CityU I am supervised by
    <a href="https://zhaoxyai.github.io/" target="_blank" rel="noopener">Prof. Xiangyu Zhao</a>
    in the Applied Machine Learning Lab
    (<a href="https://aml-cityu.github.io/" target="_blank" rel="noopener">AML</a>).
    In 2021 I received my bachelor's degree in Space Information and Digital Technology from the
    University of Electronic Science and Technology of China
    (<a href="https://en.uestc.edu.cn/" target="_blank" rel="noopener">UESTC</a>),
    ranked 2nd in my major, and was recommended for direct PhD admission to UCAS.
  zh: >-
    我是中国科学院大学（<a href="https://english.ucas.ac.cn/" target="_blank" rel="noopener">UCAS</a>）博士研究生，
    目前在香港城市大学（<a href="https://www.cityu.edu.hk/" target="_blank" rel="noopener">CityU</a>）联合培养。
    在中国科学院大学，我的导师是
    <a href="http://www.aircas.cas.cn/ykjs/lrld/202505/t20250521_7789207.html" target="_blank" rel="noopener">赵忠明教授</a>
    与 <a href="https://people.ucas.ac.cn/~0010249" target="_blank" rel="noopener">孟瑜 教授</a>；
    在香港城市大学，我在应用机器学习实验室（<a href="https://aml-cityu.github.io/" target="_blank" rel="noopener">AML</a>）
    由 <a href="https://zhaoxyai.github.io/" target="_blank" rel="noopener">赵向宇 教授</a> 指导。
    2021 年，我以专业第 2 名的成绩获得电子科技大学（<a href="https://en.uestc.edu.cn/" target="_blank" rel="noopener">UESTC</a>）
    空间信息与数字技术专业学士学位，并获推荐直接攻读博士学位。

